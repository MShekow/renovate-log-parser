services:
  certificate-generator:
    image: alpine/openssl:3.5.7@sha256:19f8eb9004a1dbaec323eed6094e9b6bcc1dbf2697ecb5fb8d2fad4e3336a8f7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3650 \
          -keyout /certificates/firewall.key \
          -out /certificates/firewall.crt \
          -subj "/CN=blocked.invalid" \
          -addext "subjectAltName=DNS:blocked.invalid"
        chmod 644 /certificates/firewall.crt
        chmod 600 /certificates/firewall.key
    volumes:
      - firewall-certificates:/certificates
    restart: no

  firewall:
    image: nginx:1.31.4-alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    depends_on:
      certificate-generator:
        condition: service_completed_successfully
    volumes:
      - ./container-firewall/nginx.conf:/etc/nginx/nginx.conf:ro
      - firewall-certificates:/etc/nginx/certificates:ro
    # By default no hostname is blocked: this base file lets Renovate reach the
    # real internet. Scenario override files (compose.<scenario>.yml) add
    # `networks.default.aliases` entries so Docker DNS points those hostnames at
    # NGINX instead. Run "docker compose down -v" after changing them, otherwise
    # the old aliases stay in effect.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 1s
      timeout: 1s
      retries: 10
    restart: no

  renovate:
    image: renovate/renovate:latest
    # The wrapper starts as root only so it can restore host ownership afterward.
    # Renovate itself runs as the image's standard ubuntu user.
    user: root
    entrypoint: ["/renovate-entrypoint.sh"]
    pull_policy: always
    depends_on:
      firewall:
        condition: service_healthy
    environment:
      RENOVATE_TOKEN: ${GITHUB_PAT}
      GITHUB_COM_TOKEN: ${GITHUB_PAT}
      RENOVATE_CONFIG_FILE: "/config.js"
      LOG_LEVEL: "debug" # use "debug" to get a lot more log output for diagnostic purposes
      LOG_FILE: "/logs/out.log"
      HOST_UID: "${LOCAL_UID:-1000}"
      HOST_GID: "${LOCAL_GID:-1000}"
    volumes:
      - ./renovate-config.js:/config.js
      - ./container-firewall/renovate-entrypoint.sh:/renovate-entrypoint.sh:ro
      - ./container-out-logs:/logs
    restart: no

volumes:
  firewall-certificates:
