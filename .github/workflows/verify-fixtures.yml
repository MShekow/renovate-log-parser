# Regenerates every Renovate log fixture from a live Renovate run against
# MShekow/renovate-log-parser-test, then re-runs the fixture tests against the
# freshly generated logs.
#
# The point is *drift detection*: the committed fixtures encode what Renovate's
# log looks like today. If a new Renovate release renames a message, drops a
# field, or stops emitting a diagnostic entirely, this workflow turns red long
# before a user hits it. Nothing is committed back — the regenerated log is
# uploaded as an artifact so the fixture can be updated deliberately.
#
# Scenario jobs that drive the shared test repository run strictly one after
# another (`needs:`). Each one starts by wiping every Renovate PR and branch, so
# Renovate always sees a pristine repository; otherwise it would report "Branch
# already exists" and skip the work the fixture captures. The `invalid-config`
# job is exempt: it uses Renovate's local platform against a directory, touches
# no repository, and therefore runs in parallel.
name: Verify log fixtures

on:
  schedule:
    # Mondays, 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# The scenarios share one test repository — never let two runs interleave.
concurrency:
  group: renovate-test-repo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  various-issues:
    name: various-issues (no host blocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/renovate-scenario
        with:
          scenario: various-issues
          compose-files: -f compose.yml
          token: ${{ secrets.TEST_REPO_PAT }}

  external-host-error:
    name: external-host-error (npm blocked)
    runs-on: ubuntu-latest
    needs: various-issues
    # Run even if the previous scenario failed, so one weekly run reports drift
    # in *all* scenarios instead of stopping at the first. `needs` still forces
    # sequential execution.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/renovate-scenario
        with:
          scenario: external-host-error
          compose-files: -f compose.yml -f compose.external-host-error.yml
          token: ${{ secrets.TEST_REPO_PAT }}

  failed-dotnet-install:
    name: failed-dotnet-install (dotnet CDN blocked)
    runs-on: ubuntu-latest
    needs: external-host-error
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/renovate-scenario
        with:
          scenario: failed-dotnet-install
          compose-files: -f compose.yml -f compose.failed-dotnet-install.yml
          # Note: the token has permissions as explained on
          # https://docs.renovatebot.com/modules/platform/github/#running-using-a-fine-grained-token
          # for the MShekow/renovate-log-parser-test repository.
          token: ${{ secrets.TEST_REPO_PAT }}

  cleanup:
    name: Clean up test repository
    runs-on: ubuntu-latest
    needs: failed-dotnet-install
    # The last scenario has no successor to clean up after it, and the test
    # repository must be left pristine even if everything above blew up.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.TEST_REPO_PAT }}
          script: await require('./.github/scripts/cleanup-renovate-prs.cjs')({github, context, core})

  # This is the only job that can run in parallel, because
  # Renovate's "local" platform runs against a plain directory
  # instead of a hosted repository, so this scenario needs no test repository,
  # no PAT and no branch cleanup — which is why it has no `needs:` and runs in
  # parallel with the chain above. It also cannot reuse the renovate-scenario
  # composite action, whose first step wipes the test repository.
  invalid-config:
    name: invalid-config (local platform, unparseable renovate.jsonc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run Renovate against a directory
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          cp src/core/__tests__/fixtures/invalid-config-repo/renovate.jsonc "$work/"
          chmod -R a+rwX "$work"

          # `--entrypoint renovate` bypasses the image's wrapper, so nothing
          # chowns the log back to this user afterwards. Pre-create it writable:
          # the container runs as uid 12021, the runner does not.
          mkdir -p container-out-logs
          chmod 777 container-out-logs
          : > container-out-logs/out.log
          chmod 666 container-out-logs/out.log

          # Renovate exits 0 even though the config is unusable — that is the
          # very gap this fixture documents, so the exit code is not a gate.
          exit_code=0
          docker run --rm \
            -v "$work":/workspace -w /workspace \
            -v "$PWD/container-out-logs":/logs \
            -e LOG_LEVEL=debug \
            -e LOG_FILE=/logs/out.log \
            -e RENOVATE_PLATFORM=local \
            --entrypoint renovate \
            renovate/renovate:latest || exit_code=$?
          echo "Renovate exited with code ${exit_code}"

      - name: Overwrite the committed fixture
        run: |
          set -euo pipefail
          log=container-out-logs/out.log
          test -s "$log" || { echo "::error::Renovate produced no log at $log"; exit 1; }
          cp "$log" src/core/__tests__/fixtures/invalid-config.jsonl
          echo "Regenerated fixture: $(wc -l < "$log") lines"
          # Informational only — a diff is expected (timestamps, pids, versions).
          git --no-pager diff --stat -- src/core/__tests__/fixtures/invalid-config.jsonl || true

      - name: Upload regenerated log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: invalid-config-log
          path: container-out-logs/out.log
          if-no-files-found: warn
          retention-days: 30

      - name: Verify fixture tests against the regenerated log
        run: npm run test:fixtures
