# Fast feedback on every push and pull request: lint, formatting, unit and
# fixture tests, plus the packaging E2E suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and fixture tests
        run: npm test

      # The browser binary comes with `npm ci` via playwright-core's cache only
      # if already present, so install it explicitly; `--with-deps` pulls the
      # shared libraries headless Chromium needs on the Ubuntu runner.
      - name: Install Chromium for the web E2E tests
        run: npx playwright-core install --with-deps chromium

      - name: Packaging E2E tests
        run: npm run test:e2e

      - name: Upload browser E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
