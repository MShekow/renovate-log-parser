# Fast feedback on every push and pull request: lint, formatting, unit and
# fixture tests, plus the packaging E2E suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and fixture tests
        run: npm test

      # Runs the whole E2E suite inside the image built from e2e/Dockerfile,
      # which also unlocks the pixel comparison against the committed
      # screenshots: those baselines are only reproducible against a pinned
      # Chromium and font set, so they are never asserted on a bare runner.
      - name: Packaging and screenshot E2E tests
        run: npm run test:e2e:screenshots

      - name: Upload browser E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
