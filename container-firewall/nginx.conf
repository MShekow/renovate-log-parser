events {}

http {
    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certificates/firewall.crt;
        ssl_certificate_key /etc/nginx/certificates/firewall.key;

        location = /health {
            access_log off;
            return 204;
        }

        location / {
            default_type text/html;
            return 200 '<!doctype html><html><head><title>Access blocked</title></head><body><h1>Access blocked</h1></body></html>';
        }
    }
}
